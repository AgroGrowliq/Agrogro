<section class="page-content"><div class="eyebrow">OUR STORY</div><h2>Helping growers find the information they need</h2><p class="muted">AgroGrow aims to make liquid fertiliser product information easier to access and understand. Our focus is clear communication, responsible product information and direct enquiries from farmers, gardeners and agricultural retailers.</p><div class="card-grid" style="margin-top:28px"><article class="content-card"><h3>Our Mission</h3><p class="muted">Help growers access clear product details and seek guidance based on verified product labels.</p></article><article class="content-card"><h3>Our Vision</h3><p class="muted">Build a trusted, approachable brand that puts practical information and grower questions first.</p></article><article class="content-card"><h3>Our USP</h3><p class="muted">Farmer-friendly communication, easy enquiry pathways and a commitment to avoiding unverified product claims.</p></article></div><h2 style="margin-top:38px">Who we serve</h2><p class="muted">Farmers, home gardeners, agricultural retailers and potential distribution partners. Team and experience details will be added when confirmed.</p></section>
